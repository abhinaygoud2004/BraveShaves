name: Microservices CI Pipeline

on:
  push:
    branches:
      - main
      - microservices

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install API Gateway dependencies
        run: npm install
        working-directory: Backend-MicroServices/api-gateway

      - name: Install User Service dependencies
        run: npm install
        working-directory: Backend-MicroServices/user-service

      - name: Install Shop Service dependencies
        run: npm install
        working-directory: Backend-MicroServices/shop-service

      - name: Install Appointment Service dependencies
        run: npm install
        working-directory: Backend-MicroServices/appointment-service

      - name: Install Payment Service dependencies
        run: npm install
        working-directory: Backend-MicroServices/payment-service

      - name: Install Notification Service dependencies
        run: npm install
        working-directory: Backend-MicroServices/notification-service

      - name: Build Docker containers
        run: docker compose build
        working-directory: Backend-MicroServices