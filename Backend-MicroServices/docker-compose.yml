version: "3.8"

services:

  # ================= MYSQL (MERGED) =================
  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Abhinay@123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database-init/sql-init:/docker-entrypoint-initdb.d

  # ================= MONGODB =================
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db
      - ./database-init/mongo-init:/docker-entrypoint-initdb.d

  # ================= REDIS =================
  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  # ================= RABBITMQ =================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  # ================= USER SERVICE =================
  user-service:
    build: ./user-service
    container_name: user-service
    restart: always
    ports:
      - "5001:5001"
    depends_on:
      - mongodb
    volumes:
      - ./shared:/app/shared
    environment:
      PORT: 5001
      MONGO_URI: mongodb://admin:password@mongodb:27017/userdb?authSource=admin
      JWT_SECRET: supersecretkey

  # ================= SHOP SERVICE =================
  shop-service:
    build: ./shop-service
    container_name: shop-service
    restart: always
    ports:
      - "5002:5002"
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    volumes:
      - ./shared:/app/shared
    environment:
      PORT: 5002
      MONGO_URI: mongodb://admin:password@mongodb:27017/shopdb?authSource=admin
      REDIS_URL: redis://redis:6379

  # ================= APPOINTMENT SERVICE =================
  appointment-service:
    build: ./appointment-service
    container_name: appointment-service
    restart: always
    ports:
      - "5003:5003"
    depends_on:
      - mysql
      - rabbitmq
    volumes:
      - ./shared:/app/shared
    environment:
      PORT: 5003
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: Abhinay@123
      DB_NAME: appointmentdb
      RABBITMQ_URL: amqp://rabbitmq

  # ================= PAYMENT SERVICE =================
  payment-service:
    build: ./payment-service
    container_name: payment-service
    restart: always
    depends_on:
      - mysql
      - rabbitmq
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: Abhinay@123
      DB_NAME: paymentdb
      RABBITMQ_URL: amqp://rabbitmq

  # ================= NOTIFICATION SERVICE =================
  notification-service:
    build: ./notification-service
    container_name: notification-service
    restart: always
    env_file:
      - ./notification-service/.env
    depends_on:
      - rabbitmq
    environment:
      RABBITMQ_URL: amqp://rabbitmq

  # ================= API GATEWAY =================
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: always
    ports:
      - "8080:5000"
    depends_on:
      - user-service
      - shop-service
      - appointment-service
    environment:
      PORT: 5000
      JWT_SECRET: alsjdfklajsdfljadflkasjdfkasbdf,nszbdjnasbdf,jakhsbfkhasbdfas
      USER_SERVICE_URL: http://user-service:5001
      SHOP_SERVICE_URL: http://shop-service:5002
      APPOINTMENT_SERVICE_URL: http://appointment-service:5003
      PAYMENT_SERVICE_URL: http://payment-service:5004

volumes:
  mysql_data:
  mongo_data: